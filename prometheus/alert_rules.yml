
groups:
  - name: nginx-alerts
    rules:
      - alert: NginxServiceDown
        expr: probe_success{job="nginx-http"} == 0
        for: 30s
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "NGINX service is down"
          description: "NGINX HTTP health check has failed for more than 30 seconds."
